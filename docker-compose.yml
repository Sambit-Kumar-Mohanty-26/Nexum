services:
  postgres:
    image: postgres:16-alpine
    container_name: proofloop-postgres
    restart: always
    environment:
      POSTGRES_USER: proofloop
      POSTGRES_PASSWORD: proofloop
      POSTGRES_DB: proofloop
    ports:
      - "5435:5432"
    volumes:
      - proofloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofloop -d proofloop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  proofloop_pgdata:
